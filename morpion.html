<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Morpion</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Nunito', sans-serif;
    padding: 16px;
  }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-family: 'Fredoka One', cursive;
    font-size: 2.8rem;
    background: linear-gradient(90deg, #f72585, #7209b7, #4cc9f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-align: center;
    filter: drop-shadow(0 0 20px rgba(247,37,133,0.4));
  }

  /* SCORES */
  .scores {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    justify-content: center;
  }

  .score-card {
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 10px 18px;
    text-align: center;
    flex: 1;
    max-width: 120px;
    backdrop-filter: blur(10px);
  }

  .score-card img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 50%;
    border: 3px solid #f72585;
    display: block;
    margin: 0 auto 6px;
  }
  .score-card.o-card img { border-color: #4cc9f0; }

  .score-card .label {
    font-size: 0.7rem;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
  }

  .score-card .num {
    font-size: 2rem;
    font-weight: 900;
    color: #f72585;
    line-height: 1;
  }
  .score-card.o-card .num { color: #4cc9f0; }
  .score-card.tie-card .num { color: #f8c;  font-size: 1.6rem; }
  .score-card.tie-card .label { color: #f8c; }

  .vs {
    font-size: 1.4rem;
    font-weight: 900;
    color: #7209b7;
  }

  /* STATUS */
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 50px;
    padding: 8px 20px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
    min-height: 50px;
    width: 100%;
    justify-content: center;
    backdrop-filter: blur(10px);
  }

  .status img {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #f72585;
  }

  /* GRID */
  .grid-wrap {
    position: relative;
    width: 312px;
    height: 312px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 104px);
    grid-template-rows: repeat(3, 104px);
    position: relative;
  }

  .line {
    position: absolute;
    background: linear-gradient(90deg, #f72585, #4cc9f0);
    border-radius: 6px;
  }
  .vl1 { width: 5px; height: 312px; left: 104px; top: 0; }
  .vl2 { width: 5px; height: 312px; left: 208px; top: 0; }
  .hl1 { height: 5px; width: 312px; top: 104px; left: 0; }
  .hl2 { height: 5px; width: 312px; top: 208px; left: 0; }

  .cell {
    width: 104px;
    height: 104px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    z-index: 1;
    transition: background 0.15s;
    border-radius: 6px;
  }

  .cell:hover:not(.taken) {
    background: rgba(255,255,255,0.06);
  }

  .cell img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #f72585;
    box-shadow: 0 0 16px rgba(247,37,133,0.5);
    animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.4);
    pointer-events: none;
  }

  .cell.o img {
    border-color: #4cc9f0;
    box-shadow: 0 0 16px rgba(76,201,240,0.5);
  }

  .cell.winner img {
    animation: pulse 0.5s ease-in-out infinite alternate;
  }

  @keyframes popIn {
    from { transform: scale(0) rotate(-20deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg);  opacity: 1; }
  }

  @keyframes pulse {
    from { transform: scale(0.95); }
    to   { transform: scale(1.1);  }
  }

  /* Win overlay line */
  .win-overlay {
    position: absolute;
    height: 8px;
    background: linear-gradient(90deg, #f72585, #7209b7, #4cc9f0);
    border-radius: 8px;
    z-index: 10;
    box-shadow: 0 0 20px rgba(247,37,133,0.7);
    transform-origin: left center;
    animation: drawLine 0.4s ease-out forwards;
  }

  @keyframes drawLine {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  /* Button */
  .btn {
    padding: 14px 40px;
    font-family: 'Fredoka One', cursive;
    font-size: 1.3rem;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    background: linear-gradient(135deg, #f72585, #7209b7);
    color: white;
    box-shadow: 0 6px 25px rgba(247,37,133,0.4);
    transition: all 0.2s;
    width: 100%;
    max-width: 312px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(247,37,133,0.5); }
  .btn:active { transform: translateY(0); }

  /* Confetti */
  .confetti-piece {
    position: fixed;
    border-radius: 3px;
    pointer-events: none;
    animation: fall linear forwards;
    z-index: 999;
  }
  @keyframes fall {
    0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>

let board = Array(9).fill(null);
let current = 'X';
let over = false;
let scores = {X:0, O:0, tie:0};

const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (board[i] ? ' taken ' + board[i].toLowerCase() : '');
    cell.onclick = () => play(i);
    if (board[i]) {
      const img = document.createElement('img');
      img.src = board[i] === 'X' ? IMG_X : IMG_O;
      cell.appendChild(img);
    }
    grid.appendChild(cell);
  }
}

function checkWin() {
  for (const c of WINS) {
    if (board[c[0]] && board[c[0]] === board[c[1]] && board[c[0]] === board[c[2]])
      return {winner: board[c[0]], combo: c};
  }
  if (board.every(Boolean)) return {winner:'tie', combo:[]};
  return null;
}

function play(i) {
  if (over || board[i]) return;
  board[i] = current;
  render();
  const res = checkWin();
  if (res) {
    over = true;
    if (res.winner === 'tie') {
      scores.tie++;
      setStatus(null, '🤝 Match nul !');
    } else {
      scores[res.winner]++;
      const name = res.winner === 'X' ? 'Joueur 1' : 'Joueur 2';
      setStatus(res.winner, '🎉 ' + name + ' gagne !');
      markWinners(res.combo);
      drawWinLine(res.combo);
      confetti();
    }
    updateScores();
  } else {
    current = current === 'X' ? 'O' : 'X';
    const name = current === 'X' ? 'Joueur 1' : 'Joueur 2';
    setStatus(current, 'Tour du ' + name);
  }
}

function setStatus(player, text) {
  const img = document.getElementById('st-img');
  document.getElementById('st-txt').textContent = text;
  if (player) {
    img.src = player === 'X' ? IMG_X : IMG_O;
    img.style.borderColor = player === 'X' ? '#f72585' : '#4cc9f0';
    img.style.display = 'block';
  } else {
    img.style.display = 'none';
  }
}

function markWinners(combo) {
  const cells = document.querySelectorAll('.cell');
  combo.forEach(i => cells[i].classList.add('winner'));
}

function drawWinLine(combo) {
  const wrap = document.querySelector('.grid-wrap');
  const el = document.createElement('div');
  el.className = 'win-overlay';
  const positions = {
    '0,1,2': {top:'52px',left:'0',width:'312px',rotate:'0deg'},
    '3,4,5': {top:'156px',left:'0',width:'312px',rotate:'0deg'},
    '6,7,8': {top:'260px',left:'0',width:'312px',rotate:'0deg'},
    '0,3,6': {top:'52px',left:'52px',width:'312px',rotate:'90deg',transformOrigin:'left top'},
    '1,4,7': {top:'52px',left:'156px',width:'312px',rotate:'90deg',transformOrigin:'left top'},
    '2,5,8': {top:'52px',left:'260px',width:'312px',rotate:'90deg',transformOrigin:'left top'},
    '0,4,8': {top:'52px',left:'0',width:'441px',rotate:'45deg'},
    '2,4,6': {top:'52px',left:'312px',width:'441px',rotate:'135deg'},
  };
  const key = combo.join(',');
  const p = positions[key];
  if (p) {
    el.style.top = p.top;
    el.style.left = p.left;
    el.style.width = p.width;
    if (p.transformOrigin) el.style.transformOrigin = p.transformOrigin;
    if (p.rotate !== '0deg') el.style.transform = 'rotate(' + p.rotate + ')';
    wrap.appendChild(el);
  }
}

function updateScores() {
  document.getElementById('sx').textContent = scores.X;
  document.getElementById('so').textContent = scores.O;
  document.getElementById('stie').textContent = scores.tie;
}

function confetti() {
  const colors = ['#f72585','#7209b7','#4cc9f0','#ffd60a','#06d6a0','#ff9f1c'];
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      top:-20px;
      width:${6+Math.random()*8}px;
      height:${6+Math.random()*8}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation-duration:${1.5+Math.random()*2}s;
      animation-delay:${Math.random()*0.5}s;
      border-radius:${Math.random()>0.5?'50%':'3px'};
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}

function restart() {
  board = Array(9).fill(null);
  current = 'X';
  over = false;
  setStatus('X', 'Tour du Joueur 1');
  document.querySelectorAll('.win-overlay').forEach(e => e.remove());
  render();
}

render();
</script>
